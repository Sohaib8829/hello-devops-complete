name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Code Download Karo
        uses: actions/checkout@v4

      - name: Python install karo 
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies install karo 
        run: pip install -r requirements.txt 

      - name: Tests Chalao
        run: pytest -v
